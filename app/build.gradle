plugins { id 'com.android.application' }

android {
    namespace 'com.lumilearn.english'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lumilearn.english'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Lumi English</title>
  <style>
    :root {
      --ink: #20294b;
      --muted: #76809e;
      --cream: #fff9f0;
      --paper: #ffffff;
      --lavender: #eae7ff;
      --purple: #5c5ce6;
      --purple-dark: #4648bb;
      --mint: #52d7b4;
      --mint-dark: #199e83;
      --coral: #ff8e74;
      --yellow: #ffd36e;
      --line: #e8e8f1;
      --shadow: 0 14px 34px rgba(45, 48, 104, .13);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; color: var(--ink); background: var(--cream); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; }
    button { font: inherit; border: 0; cursor: pointer; color: inherit; }
    .app-shell { min-height: 100vh; max-width: 560px; margin: 0 auto; background: linear-gradient(180deg, #fff9f0 0%, #f5f2ff 76%, #f2f3ff 100%); position: relative; overflow: hidden; }
    .topbar { padding: calc(15px + env(safe-area-inset-top)) 20px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; background: rgba(255,249,240,.9); backdrop-filter: blur(14px); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.3px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 14px; background: var(--purple); display: grid; place-items: center; box-shadow: 0 5px 0 #4546ad; }
    .brand-mark svg { width: 28px; height: 28px; }
    .brand small { display: block; font-size: 10px; letter-spacing: 1.4px; color: var(--purple); text-transform: uppercase; margin-top: 2px; }
    .stats { display: flex; gap: 7px; }
    .stat-pill { display: flex; align-items: center; gap: 5px; padding: 7px 9px; border: 1px solid rgba(32,41,75,.08); background: rgba(255,255,255,.75); border-radius: 13px; font-weight: 800; font-size: 12px; box-shadow: 0 4px 12px rgba(50,50,100,.05); }
    .stat-pill span { font-size: 16px; }
    main { padding: 5px 18px calc(102px + env(safe-area-inset-bottom)); min-height: calc(100vh - 78px); }
    .screen-enter { animation: screenIn .36s ease both; }
    @keyframes screenIn { from { opacity: 0; transform: translateY(11px); } to { opacity: 1; transform: translateY(0); } }
    .hero { position: relative; margin: 12px 0 18px; padding: 22px 20px 20px; min-height: 186px; border-radius: 28px; color: white; overflow: hidden; background: radial-gradient(circle at 94% 16%, rgba(255,255,255,.27), transparent 26%), linear-gradient(135deg, #5c5ce6, #7a74ed 56%, #9b90ff); box-shadow: 0 15px 28px rgba(92,92,230,.25); }
    .hero:after { content: ""; position: absolute; width: 190px; height: 190px; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; right: -55px; bottom: -100px; box-shadow: 0 0 0 16px rgba(255,255,255,.06), 0 0 0 34px rgba(255,255,255,.05); }
    .hero-copy { max-width: 60%; position: relative; z-index: 1; }
    .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.3px; opacity: .82; text-transform: uppercase; }
    .hero h1 { font-size: 26px; line-height: 1.15; margin: 8px 0 8px; letter-spacing: -.8px; }
    .hero p { margin: 0 0 16px; font-size: 13px; line-height: 1.5; opacity: .88; }
    .primary-btn { padding: 12px 18px; border-radius: 15px; font-weight: 800; background: white; color: var(--purple-dark); box-shadow: 0 5px 0 rgba(63,63,151,.26); transition: transform .16s ease, box-shadow .16s ease; }
    .primary-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(63,63,151,.25); }
    .mascot { position: absolute; z-index: 1; right: 20px; bottom: 16px; width: 122px; height: 122px; animation: bob 3s ease-in-out infinite; filter: drop-shadow(0 12px 9px rgba(42,33,116,.2)); }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
    .section-head { display: flex; align-items: end; justify-content: space-between; margin: 10px 2px 12px; }
    .section-head h2 { margin: 0; font-size: 18px; letter-spacing: -.3px; }
    .section-head span { font-size: 12px; color: var(--muted); font-weight: 700; }
    .goal-card { padding: 15px; display: flex; align-items: center; gap: 13px; border-radius: 20px; background: rgba(255,255,255,.76); border: 1px solid rgba(92,92,230,.08); box-shadow: 0 8px 22px rgba(45,48,104,.06); }
    .goal-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 16px; background: #fff0cb; font-size: 23px; }
    .goal-copy { flex: 1; }
    .goal-copy strong { display: block; font-size: 14px; }
    .goal-copy small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .progress-track { height: 7px; margin-top: 9px; border-radius: 99px; background: #eeeaf7; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mint), #8ae5ca); transition: width .45s ease; }
    .goal-xp { font-size: 12px; font-weight: 900; color: var(--mint-dark); white-space: nowrap; }
    .route { position: relative; padding: 12px 4px 0; }
    .route:before { content: ""; position: absolute; width: 4px; top: 30px; bottom: 42px; left: 31px; border-radius: 99px; background: linear-gradient(var(--mint), #d3d2ef 70%); }
    .unit-card { position: relative; margin: 0 0 16px 0; padding: 15px 14px 14px 66px; border-radius: 23px; background: rgba(255,255,255,.85); border: 1px solid rgba(92,92,230,.08); box-shadow: 0 8px 22px rgba(45,48,104,.06); }
    .unit-badge { position: absolute; left: 11px; top: 17px; width: 41px; height: 41px; border-radius: 50%; display: grid; place-items: center; color: white; font-weight: 900; font-size: 14px; border: 4px solid #fff9f0; box-shadow: 0 3px 0 rgba(32,41,75,.11); z-index: 1; }
    .unit-badge.mint { background: var(--mint); }
    .unit-badge.purple { background: var(--purple); }
    .unit-badge.coral { background: var(--coral); }
    .unit-card h3 { margin: 0; font-size: 15px; }
    .unit-card p { margin: 4px 0 12px; color: var(--muted); font-size: 12px; }
    .lesson-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .lesson-row::-webkit-scrollbar { display: none; }
    .lesson-node { min-width: 46px; height: 46px; border-radius: 16px; background: #efeff8; color: #a2a5bb; display: grid; place-items: center; font-weight: 900; font-size: 14px; box-shadow: inset 0 -3px 0 rgba(32,41,75,.08); transition: transform .16s ease; }
    .lesson-node.done { background: #bff3e5; color: #198d77; }
    .lesson-node.current { background: var(--purple); color: white; box-shadow: 0 4px 0 #4142ad; animation: pulse 2.2s ease-in-out infinite; }
    .lesson-node:active { transform: scale(.92); }
    @keyframes pulse { 0%,100% { box-shadow: 0 4px 0 #4142ad, 0 0 0 0 rgba(92,92,230,.22); } 50% { box-shadow: 0 4px 0 #4142ad, 0 0 0 8px rgba(92,92,230,0); } }
    .bottom-nav { position: fixed; z-index: 10; left: 50%; bottom: 0; transform: translateX(-50%); width: min(560px, 100%); padding: 8px 18px calc(9px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; background: rgba(255,249,240,.88); backdrop-filter: blur(18px); border-top: 1px solid rgba(32,41,75,.08); }
    .nav-item { padding: 7px 2px 4px; background: transparent; color: #9ca2bb; font-size: 10px; font-weight: 800; border-radius: 14px; }
    .nav-item span { display: block; font-size: 22px; line-height: 24px; margin-bottom: 2px; filter: grayscale(1); opacity: .68; }
    .nav-item.active { color: var(--purple); background: rgba(92,92,230,.08); }
    .nav-item.active span { filter: none; opacity: 1; }
    .lesson-shell { min-height: calc(100vh - 104px); display: flex; flex-direction: column; }
    .lesson-top { display: flex; align-items: center; gap: 12px; padding: 8px 0 18px; }
    .icon-btn { width: 44px; height: 44px; border-radius: 13px; background: rgba(255,255,255,.82); color: var(--muted); font-size: 20px; display: grid; place-items: center; }
    .lesson-progress { flex: 1; height: 10px; border-radius: 99px; background: #e4e2f2; overflow: hidden; }
    .lesson-progress > div { height: 100%; background: linear-gradient(90deg, var(--mint), #90e9d1); border-radius: inherit; transition: width .35s ease; }
    .points-mini { font-size: 12px; font-weight: 900; color: var(--purple); white-space: nowrap; }
    .question-card { padding: 21px 17px; background: white; border-radius: 26px; box-shadow: var(--shadow); margin-bottom: 16px; }
    .question-tag { display: inline-flex; align-items: center; gap: 6px; color: var(--purple); background: var(--lavender); padding: 6px 9px; border-radius: 9px; font-size: 11px; font-weight: 900; }
    .question-card h2 { margin: 17px 0 7px; font-size: 25px; line-height: 1.25; letter-spacing: -.5px; }
    .question-card p { margin: 0; color: var(--muted); font-size: 14px; }
    .audio-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 17px; padding: 10px 13px; border-radius: 14px; background: #eefcf8; color: var(--mint-dark); font-weight: 900; font-size: 13px; }
    .audio-btn:active { transform: scale(.97); }
    .word-hint { background: transparent; border-bottom: 2px dotted var(--purple); padding: 3px 4px; color: var(--purple); font-weight: 800; }
    .answer-grid { display: grid; gap: 10px; margin-top: 5px; }
    .answer-btn { text-align: left; padding: 15px 15px; border-radius: 16px; background: rgba(255,255,255,.82); border: 2px solid #e8e8f1; font-size: 15px; font-weight: 750; transition: .18s ease; box-shadow: 0 3px 0 rgba(32,41,75,.06); }
    .answer-btn:active { transform: translateY(2px); }
    .answer-btn.selected { border-color: var(--purple); background: #f0efff; }
    .answer-btn.correct { border-color: var(--mint); background: #e9fbf6; color: var(--mint-dark); }
    .answer-btn.wrong { border-color: var(--coral); background: #fff0ec; color: #d0644e; }
    .token-bank, .token-answer { display: flex; gap: 8px; flex-wrap: wrap; min-height: 47px; padding: 9px; border-radius: 16px; background: #f7f6fc; border: 2px dashed #dddcef; }
    .token-answer { margin-bottom: 11px; background: #fff; border-style: solid; }
    .token { min-width: 44px; padding: 9px 12px; border-radius: 12px; background: #fff; box-shadow: 0 3px 0 #dedeea; font-weight: 800; }
    .token:active { transform: translateY(2px); box-shadow: 0 1px 0 #dedeea; }
    .lesson-footer { margin-top: auto; padding-top: 18px; }
    .feedback { display: none; padding: 14px 15px; border-radius: 17px; margin-bottom: 10px; background: #e9fbf6; color: var(--mint-dark); }
    .feedback.show { display: flex; align-items: center; gap: 11px; animation: pop .3s ease both; }
    .feedback.bad { background: #fff0ec; color: #d0644e; }
    .feedback strong { display: block; font-size: 14px; }
    .feedback small { display: block; font-size: 12px; margin-top: 2px; opacity: .85; }
    .continue-btn { width: 100%; padding: 15px; border-radius: 17px; color: white; background: var(--purple); font-weight: 900; box-shadow: 0 5px 0 #4142ad; }
    .continue-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4142ad; }
    .result-card { text-align: center; padding: 26px 20px; margin-top: 18px; background: white; border-radius: 28px; box-shadow: var(--shadow); }
    .result-burst { font-size: 57px; animation: pop .5s ease both; }
    .result-card h1 { margin: 7px 0; font-size: 26px; }
    .result-card p { color: var(--muted); line-height: 1.5; font-size: 14px; margin: 0 auto 18px; max-width: 270px; }
    .result-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin: 18px 0; }
    .result-stat { padding: 12px 5px; border-radius: 16px; background: #f7f6fc; }
    .result-stat strong { display: block; font-size: 18px; color: var(--purple); }
    .result-stat small { font-size: 11px; color: var(--muted); }
    .profile-card { padding: 22px; border-radius: 26px; color: white; background: linear-gradient(135deg,#20294b,#404c80); box-shadow: 0 16px 30px rgba(32,41,75,.2); }
    .profile-head { display: flex; align-items: center; gap: 13px; }
    .avatar { width: 54px; height: 54px; border-radius: 20px; background: #ffcf6e; display: grid; place-items: center; font-size: 28px; }
    .profile-head h2 { margin: 0 0 3px; font-size: 18px; }
    .profile-head p { margin: 0; opacity: .7; font-size: 12px; }
    .profile-metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 20px; }
    .metric { padding: 10px 4px; border-radius: 14px; background: rgba(255,255,255,.1); text-align: center; }
    .metric strong { display: block; font-size: 18px; }
    .metric small { font-size: 10px; opacity: .7; }
    .settings-list { margin-top: 19px; display: grid; gap: 10px; }
    .setting { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-radius: 19px; background: rgba(255,255,255,.82); box-shadow: 0 7px 18px rgba(45,48,104,.05); }
    .setting-copy { display: flex; align-items: center; gap: 11px; }
    .setting-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; background: var(--lavender); }
    .setting strong { display: block; font-size: 14px; }
    .setting small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .toggle { width: 44px; height: 25px; border-radius: 99px; background: #dfe0eb; padding: 3px; }
    .toggle:after { content: ""; display: block; width: 19px; height: 19px; background: white; border-radius: 50%; box-shadow: 0 2px 4px rgba(0,0,0,.15); transition: transform .2s ease; }
    .toggle.on { background: var(--mint); }
    .toggle.on:after { transform: translateX(19px); }
    .toast-wrap { position: fixed; z-index: 30; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(88%, 380px); pointer-events: none; }
    .toast { padding: 13px 15px; margin-top: 8px; color: white; background: rgba(32,41,75,.94); border-radius: 15px; text-align: center; font-size: 13px; font-weight: 750; box-shadow: 0 9px 22px rgba(32,41,75,.2); animation: toastIn .25s ease both; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.85); } 100% { opacity: 1; transform: scale(1); } }
    .confetti { position: fixed; z-index: 25; top: 38%; left: 50%; width: 8px; height: 14px; border-radius: 3px; animation: confetti 950ms ease-out forwards; }
    @keyframes confetti { 0% { transform: translate(-50%,-50%) rotate(0); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(480deg); opacity: 0; } }
    .empty-state { padding: 40px 18px; text-align: center; color: var(--muted); }
    @media (min-width: 540px) { .app-shell { box-shadow: 0 0 44px rgba(39,43,98,.1); } }
  </style>

    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 48 48" fill="none"><path d="M10 18 Q9 7 18 5 Q23 12 25 18 Z" fill="#f59e4f"/><path d="M13 16 Q13 9 18 8 Q21 12 22 16 Z" fill="#ffb3b3"/><path d="M38 18 Q39 7 30 5 Q25 12 23 18 Z" fill="#f59e4f"/><path d="M35 16 Q35 9 30 8 Q27 12 26 16 Z" fill="#ffb3b3"/><ellipse cx="24" cy="27" rx="17" ry="16" fill="#ffb870"/><ellipse cx="18" cy="25" rx="3.5" ry="4" fill="#2d3748"/><circle cx="17" cy="23.5" r="1.2" fill="white"/><ellipse cx="30" cy="25" rx="3.5" ry="4" fill="#2d3748"/><circle cx="29" cy="23.5" r="1.2" fill="white"/><path d="M22 30 Q24 28.5 26 30 Q24 32.5 22 30 Z" fill="#ff8fa3"/><path d="M24 31.5 L24 34 M24 34 Q21.5 36 20 34.5 M24 34 Q26.5 36 28 34.5" stroke="#c97b5a" stroke-width="1.2" stroke-linecap="round"/><path d="M10 28 L4 26 M10 31 L4 31 M38 28 L44 26 M38 31 L44 31" stroke="#c97b5a" stroke-width="1" stroke-linecap="round" opacity=".6"/><ellipse cx="13" cy="31" rx="2.5" ry="1.8" fill="rgba(255,143,163,.35)"/><ellipse cx="35" cy="31" rx="2.5" ry="1.8" fill="rgba(255,143,163,.35)"/></svg></div>

  <main id="main"></main>
